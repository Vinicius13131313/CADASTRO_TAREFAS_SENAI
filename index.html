<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>  

<body>

    <div class="gif-box" id="gif-box">
        <img src="img/thumbsup.jpg" id="img-joia">
    </div>

    <audio id="som-concluido" src="finished.mp3"></audio>

    <main class="caixa">

        <div class="topo">
            <div>
                <h1>Lista de Tarefas</h1>
                <p>Organize suas tarefas</p>
            </div>

            <button id="tema" class="btn-tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div class="entrada">
            <input type="text" id="tarefa" placeholder="Digite uma tarefa..." maxlength="40">

            <button id="adicionar">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div class="contador" id="contador">
            0 tarefas
        </div>

        <ul id="lista"></ul>

    </main>

    <script src="script.js"></script>
</body>
</html>
